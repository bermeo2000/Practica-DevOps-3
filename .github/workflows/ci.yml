name: CI Proyecto Full Stack
on:
  push:
    branches:
      - main
      - feat/teste
  pull_request:
    branches:
      - main
jobs:

  detectar-cambios:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

        with:
          fetch-depth: 0
      - name: Detectar archivos modificados
        uses: dorny/paths-filter@v3
        id: filter

        with:
          base: ${{ github.event.before }}

          filters: |

            backend:
                - 'backend/**'
                - 'README.md'
                - '.github/**'
                - '.gitignore'

            frontend:
                - 'frontend/**'
                - 'README.md'
                - '.github/**'
                - '.gitignore'

            docker:
                - 'docker-compose.yml'
                - 'Dockerfile'
                - 'README.md'
                - '.github/**'
                - '.gitignore'

  validar-backend:

    name: Validar Backend
    needs: detectar-cambios

    if: needs.detectar-cambios.outputs.backend == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4

        with:

          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias Backend
        working-directory: ./backend
        run: npm ci
      - name: Generar cliente Prisma
        working-directory: ./backend
        run: npx prisma generate
      - name: Ejecutar pruebas Backend
        working-directory: ./backend
        run: npm test

      - name: Verificar calidad Backend
        working-directory: ./backend
        run: npm run lint --if-present
      - name: Construir Backend
        working-directory: ./backend
        run: npm run build --if-present

  validar-frontend:

    name: Validar Frontend
    needs: detectar-cambios
    if: needs.detectar-cambios.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4

        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias Frontend
        working-directory: ./frontend
        run: npm ci
      - name: Ejecutar pruebas Frontend
        working-directory: ./frontend
        run: npm test --if-present
      - name: Verificar calidad Frontend
        working-directory: ./frontend
        run: npm run lint --if-present
      - name: Construir Frontend
        working-directory: ./frontend
        run: npm run build

  validar-docker:
    name: Validar Docker
    needs: detectar-cambios
    if: needs.detectar-cambios.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Validar Docker Compose
        run: docker compose config
      - name: Construir imágenes Docker
        run: docker compose build